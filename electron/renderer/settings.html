<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Preferences</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="settings-window">
        <main>
            <div class="label">Origin Folder</div>
            <div class="path-display" id="path-display">Loading…</div>

            <div class="actions">
                <button class="btn" id="choose-btn">Select…</button>
            </div>

            <div class="actions actions-end">
                <button class="btn" id="cancel-btn">Cancel</button>
                <button class="btn btn-primary" id="confirm-btn">
                    Confirm
                </button>
            </div>

            <a class="footnote" href="#" id="reveal-link"
                >Open config manifest →</a
            >
        </main>
        <script src="settings.js"></script>
    </body>
</html>
